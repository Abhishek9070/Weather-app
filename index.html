<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app">
    <div class="header">
      <i class="fas fa-cloud-sun header-icon"></i>
      <h1>Weather Forecast</h1>
    </div>

    <div class="input-group">
      <div class="search-container">
        <i class="fas fa-search search-icon"></i>
        <input type="text" id="cityInput" placeholder="Search for a city..." />
      </div>
      <button id="searchBtn">
        <i class="fas fa-arrow-right"></i>
      </button>
    </div>
    
    <p id="loading" class="loading-msg">
      <i class="fas fa-spinner fa-spin"></i> Loading...
    </p>
    <p id="message" class="error-msg"></p>

    <div id="weatherBox" class="weather-box">
      <div class="weather-icon-display">
        <i id="weatherIcon" class="fas fa-sun"></i>
      </div>
      <h2 id="cityName" class="city-name"></h2>
      <p id="temperature" class="temperature"></p>
      <p id="description" class="description"></p>
      <div id="weatherDetails" class="weather-details">
        <div class="detail-item">
          <i class="fas fa-wind"></i>
          <div>
            <p class="detail-label">Wind</p>
            <p id="windSpeed" class="detail-value">-- km/h</p>
          </div>
        </div>
        <div class="detail-item">
          <i class="fas fa-tint"></i>
          <div>
            <p class="detail-label">Humidity</p>
            <p id="humidity" class="detail-value">--%</p>
          </div>
        </div>
        <div class="detail-item">
          <i class="fas fa-temperature-high"></i>
          <div>
            <p class="detail-label">Feels Like</p>
            <p id="feelsLike" class="detail-value">-- °C</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
